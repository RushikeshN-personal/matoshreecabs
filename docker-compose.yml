services:
  postgres:
    image: postgres:16-alpine
    container_name: matoshreecabs-postgres
    environment:
      POSTGRES_USER: matoshreecabs
      POSTGRES_PASSWORD: matoshreecabs
      POSTGRES_DB: matoshreecabs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
